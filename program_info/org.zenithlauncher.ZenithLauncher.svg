<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726"/>
      <stop offset="100%" stop-color="#0B0C14"/>
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield with rounded corners -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#darkBg)" stroke="url(#cyberCyan)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Glowing Zenith Peak / Stylized "Z" Crystal Gem -->
  <g filter="url(#neonGlow)">
    <!-- Top Apex facet -->
    <path d="M128 36L188 88H68L128 36Z" fill="url(#cyberCyan)"/>

    <!-- Left Crystal Blade -->
    <path d="M68 88L128 140L88 160L44 116L68 88Z" fill="url(#cyberPurple)"/>

    <!-- Center Core Gem -->
    <path d="M128 88L188 88L128 176L68 176L128 88Z" fill="url(#cyberCyan)"/>

    <!-- Right Crystal Blade -->
    <path d="M188 88L212 116L168 160L128 140L188 88Z" fill="url(#cyberCyan)" fill-opacity="0.85"/>

    <!-- Bottom Peak -->
    <path d="M128 220L84 176H172L128 220Z" fill="url(#cyberPurple)"/>

    <!-- Inner "Z" Beam -->
    <path d="M80 102H176L104 154H176V166H80L152 114H80V102Z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Accent sparks -->
  <circle cx="128" cy="36" r="4" fill="#00F2FE"/>
  <circle cx="44" cy="116" r="3" fill="#E100FF"/>
  <circle cx="212" cy="116" r="3" fill="#00F2FE"/>
  <circle cx="128" cy="220" r="4" fill="#7F00FF"/>
</svg>
